name: cd

on:
  push:
    branches:
      - main
    paths:
      - 'src/terraform/**'
      - '.github/workflows/**'

env:
  WORKING_DIRECTORY: "src/terraform"
  APPLICATION_NAME: "aztf"
  ENVIRONMENT_NAME: "dev"
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform Apply

        env:
          ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ vars.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}  
          BACKEND_RESOURCE_GROUP_NAME: ${{ vars.Backend_resource_group_name }}
          BACKEND_STORAGE_ACCOUNT_NAME: ${{ vars.Backend_Storage_Account_Name }}
          BACKEND_STORAGE_CONTAINER_NAME: ${{ vars.Backend_Container_Name }}
          TF-VARS_APPLICATION_NAME: ${{ env.APPLICATION_NAME }}
          TF-VARS_ENVIRONMENT_NAME: ${{ env.ENVIRONMENT_NAME }}
          TF_BACKEND_KEY: ${{ env.APPLICATION_NAME }}-${{ env.ENVIRONMENT_NAME }}
          WORKING_DIRECTORY: ${{ env.WORKING_DIRECTORY }} 
        run: |
          terraform init \  
            -backend-config="resource_group_name=${BACKEND_RESOURCE_GROUP_NAME}" \
            -backend-config="storage_account_name=${BACKEND_STORAGE_ACCOUNT_NAME}" \
            -backend-config="container_name=${BACKEND_STORAGE_CONTAINER_NAME}" \
            -backend-config="key=${TF_BACKEND_KEY}"

          terraform apply -auto-approve \


  





      